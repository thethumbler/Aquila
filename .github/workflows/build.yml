name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib bison flex \
            texinfo libgmp-dev libmpfr-dev libmpc-dev wget nasm xorriso cpio \
            qemu-system-x86 e2fsprogs python3 fdisk dosfstools mtools fakeroot

      # QEMU runs the tests with KVM if /dev/kvm can be used
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # the toolchain takes a while to build, rebuild it only when its
      # sources (or the ABI headers it installs) change
      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            build/toolchain
            build/sysroot
          key: toolchain-${{ hashFiles('toolchain/**', 'libc/**', 'include/uapi/**') }}

      - name: Build toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: make toolchain

      - name: Build the base system (kernel, userland, contrib) and ports
        run: make all ports

      - name: Build ISO and hard disk image
        run: make initrd iso hdd

      - name: Test
        run: tests/run.sh -v

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: aquila
          path: |
            build/aquila.iso
            build/aquila.img
            build/initrd.img
            build/kernel/kernel-*.i386
