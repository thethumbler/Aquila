# Limine configuration of the hard disk image (mk/hdd.sh), the root
# filesystem is its second partition

timeout: 3

# menu on the serial port too
serial: yes

/AquilaOS
    protocol: multiboot1
    path: boot():/boot/kernel
    cmdline: root=/dev/hda2

/AquilaOS (serial console)
    protocol: multiboot1
    path: boot():/boot/kernel
    cmdline: root=/dev/hda2 earlycon=ttyS0
