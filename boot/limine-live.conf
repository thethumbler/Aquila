# Limine configuration of the live disk (make live), see
# https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
#
# The kernel and the initrd are gzip'd ($); the console is VGA text mode
# and the serial port, which a browser's emulator (v86) shows

timeout: 1

serial: yes

/AquilaOS
    protocol: multiboot1
    path: $boot():/boot/kernel.gz
    cmdline: earlycon=ttyS0
    module_path: $boot():/boot/initrd.gz
