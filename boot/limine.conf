# Limine configuration, see https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md

timeout: 3

# menu on the serial port too
serial: yes

# the screen (width x height x bits per pixel) is each entry's resolution:

/AquilaOS
    protocol: multiboot1
    path: boot():/boot/kernel
    resolution: 1280x800x32
    module_path: boot():/boot/initrd.img

/AquilaOS (serial console)
    protocol: multiboot1
    path: boot():/boot/kernel
    resolution: 1280x800x32
    cmdline: earlycon=ttyS0
    module_path: boot():/boot/initrd.img
